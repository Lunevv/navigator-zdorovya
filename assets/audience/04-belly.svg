<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Пузырьки газообразования">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#E6DCC4"/>
    </linearGradient>
    <radialGradient id="bubB" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8F2A8"/>
      <stop offset="60%" stop-color="#C8DC4A"/>
      <stop offset="100%" stop-color="#A6BE2E"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgB)"/>
  <ellipse cx="100" cy="170" rx="56" ry="6" fill="#2F4A36" opacity="0.12"/>

  <!-- восходящие пузырьки -->
  <g stroke="#2F4A36" stroke-width="1.6">
    <circle cx="96"  cy="112" r="30" fill="url(#bubB)"/>
    <circle cx="64"  cy="142" r="16" fill="url(#bubB)"/>
    <circle cx="132" cy="138" r="20" fill="url(#bubB)"/>
    <circle cx="120" cy="70"  r="13" fill="url(#bubB)"/>
    <circle cx="74"  cy="74"  r="10" fill="url(#bubB)"/>
    <circle cx="148" cy="92"  r="8"  fill="url(#bubB)"/>
    <circle cx="48"  cy="104" r="7"  fill="url(#bubB)"/>
    <circle cx="100" cy="48"  r="6"  fill="url(#bubB)"/>
  </g>

  <!-- блики на пузырьках -->
  <g fill="#FBF4E4" opacity="0.8">
    <circle cx="86"  cy="100" r="6"/>
    <circle cx="57"  cy="135" r="3.4"/>
    <circle cx="124" cy="130" r="4.4"/>
    <circle cx="115" cy="65"  r="3"/>
    <circle cx="70"  cy="70"  r="2.4"/>
  </g>
</svg>
