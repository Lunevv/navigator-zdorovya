<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Вздутый живот, руки на животе, бурление">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#E6DCC4"/>
    </linearGradient>
    <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BCD08A"/>
      <stop offset="100%" stop-color="#9FB86F"/>
    </linearGradient>
    <linearGradient id="handG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2DDC6"/>
      <stop offset="100%" stop-color="#E8CDAE"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgB)"/>
  <ellipse cx="100" cy="170" rx="56" ry="6" fill="#2F4A36" opacity="0.12"/>

  <!-- торс со вздутым животом -->
  <path d="M70 44 C 70 40 130 40 130 44 L126 70
           C 150 86 154 134 138 158 L62 158 C 46 134 50 86 74 70 Z"
        fill="url(#shirtG)" stroke="#2F4A36" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- горловина -->
  <path d="M86 44 C 92 54 108 54 114 44" fill="none" stroke="#2F4A36" stroke-width="2.2" stroke-linecap="round"/>

  <!-- волны «бурления» внутри живота -->
  <g fill="none" stroke="#2F4A36" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M78 108 q 7 -7 14 0 t 14 0 t 14 0"/>
    <path d="M78 122 q 7 -7 14 0 t 14 0 t 14 0"/>
  </g>
  <g fill="#C8DC4A" stroke="#2F4A36" stroke-width="1">
    <circle cx="92" cy="116" r="3"/>
    <circle cx="110" cy="115" r="2.4"/>
    <circle cx="101" cy="133" r="2.2"/>
  </g>

  <!-- руки, держащиеся за живот -->
  <g fill="url(#handG)" stroke="#2F4A36" stroke-width="2.2" stroke-linejoin="round">
    <path d="M52 120 C 58 110 70 110 80 116 C 86 120 90 128 88 138 C 80 142 64 142 56 136 C 50 132 48 126 52 120 Z"/>
    <path d="M148 120 C 142 110 130 110 120 116 C 114 120 110 128 112 138 C 120 142 136 142 144 136 C 150 132 152 126 148 120 Z"/>
  </g>
  <!-- пальцы -->
  <g fill="none" stroke="#2F4A36" stroke-width="1.6" stroke-linecap="round">
    <path d="M80 118 C 84 124 84 132 82 138"/>
    <path d="M74 117 C 78 123 78 132 76 139"/>
    <path d="M68 117 C 72 123 72 132 70 139"/>
    <path d="M120 118 C 116 124 116 132 118 138"/>
    <path d="M126 117 C 122 123 122 132 124 139"/>
    <path d="M132 117 C 128 123 128 132 130 139"/>
  </g>

  <!-- лёгкие волны-«радиация» дискомфорта по бокам -->
  <g fill="none" stroke="#A6BE2E" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M40 96 q -6 6 0 12"/>
    <path d="M160 96 q 6 6 0 12"/>
  </g>
</svg>
