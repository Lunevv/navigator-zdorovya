<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Портновская мерная лента">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#E6DCC4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgT)"/>
  <ellipse cx="100" cy="162" rx="58" ry="6" fill="#2F4A36" opacity="0.12"/>

  <!-- свисающая полоса ленты (тело + обводка) -->
  <path d="M118 78 C 108 104 96 128 90 156" fill="none" stroke="#2F4A36" stroke-width="26" stroke-linecap="round"/>
  <path d="M118 78 C 108 104 96 128 90 156" fill="none" stroke="#FBF4E4" stroke-width="21" stroke-linecap="round"/>

  <!-- деления на полосе -->
  <g stroke="#2F4A36" stroke-width="1.5" stroke-linecap="round">
    <line x1="104" y1="92"  x2="120" y2="96"/>
    <line x1="100" y1="104" x2="113" y2="107"/>
    <line x1="97"  y1="116" x2="113" y2="120"/>
    <line x1="93"  y1="128" x2="106" y2="131"/>
    <line x1="91"  y1="140" x2="107" y2="144"/>
    <line x1="88"  y1="152" x2="101" y2="155"/>
  </g>

  <!-- металлический наконечник -->
  <rect x="80" y="150" width="16" height="10" rx="2.5" fill="#C8DC4A" stroke="#2F4A36" stroke-width="1.6"/>

  <!-- рулон ленты (бобина) -->
  <circle cx="118" cy="72" r="32" fill="#FBF4E4" stroke="#2F4A36" stroke-width="3"/>
  <circle cx="118" cy="72" r="22" fill="none" stroke="#2F4A36" stroke-width="1.2" opacity="0.45"/>
  <circle cx="118" cy="72" r="11" fill="#EFE3C7" stroke="#2F4A36" stroke-width="2.4"/>
  <circle cx="118" cy="72" r="3" fill="#A6BE2E"/>

  <circle cx="56" cy="58" r="3" fill="#A6BE2E"/>
  <circle cx="44" cy="68" r="2" fill="#A6BE2E" opacity="0.6"/>
</svg>
