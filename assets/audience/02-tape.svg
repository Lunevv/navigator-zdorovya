<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Портновская мерная лента">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#E6DCC4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgT)"/>
  <ellipse cx="100" cy="168" rx="60" ry="6" fill="#2F4A36" opacity="0.12"/>

  <!-- лента «змейкой» через весь тайл: тёмная подложка + молочная лента -->
  <path d="M44 46 C 12 70 20 102 60 104 C 100 106 108 138 76 158"
        fill="none" stroke="#2F4A36" stroke-width="26" stroke-linecap="round"/>
  <path d="M44 46 C 12 70 20 102 60 104 C 100 106 108 138 76 158"
        fill="none" stroke="#FBF4E4" stroke-width="21" stroke-linecap="round"/>

  <!-- деления вдоль изгибов ленты -->
  <g stroke="#2F4A36" stroke-width="1.5" stroke-linecap="round">
    <line x1="40"  y1="40"  x2="48"  y2="55"/>
    <line x1="26"  y1="54"  x2="38"  y2="63"/>
    <line x1="20"  y1="74"  x2="35"  y2="78"/>
    <line x1="24"  y1="92"  x2="38"  y2="86"/>
    <line x1="48"  y1="98"  x2="52"  y2="113"/>
    <line x1="70"  y1="100" x2="74"  y2="115"/>
    <line x1="92"  y1="110" x2="80"  y2="120"/>
    <line x1="104" y1="128" x2="90"  y2="133"/>
    <line x1="98"  y1="148" x2="83"  y2="143"/>
  </g>

  <!-- металлический наконечник на конце ленты -->
  <rect x="66" y="152" width="16" height="11" rx="2.5" transform="rotate(-18 74 157.5)" fill="#C8DC4A" stroke="#2F4A36" stroke-width="1.6"/>

  <!-- лёгкие акценты -->
  <circle cx="150" cy="52" r="3" fill="#A6BE2E"/>
  <circle cx="162" cy="64" r="2" fill="#A6BE2E" opacity="0.6"/>
</svg>
