<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Грустная девочка с высыпаниями на коже и ломкими волосами">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#E6DCC4"/>
    </linearGradient>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2DDC6"/>
      <stop offset="100%" stop-color="#E8CDAE"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A08A66"/>
      <stop offset="100%" stop-color="#857049"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgS)"/>
  <ellipse cx="100" cy="172" rx="52" ry="6" fill="#2F4A36" opacity="0.12"/>

  <!-- задняя масса волос: неряшливая, со свисающими ломкими прядями -->
  <path d="M60 116 C 50 70 72 36 100 36 C 128 36 150 70 140 116
           C 138 126 142 138 136 150 L131 138 L126 152 L121 140 L116 156 L112 142
           L108 158 L104 144 L100 160 L96 144 L92 158 L88 142 L84 156 L79 140 L74 152 L69 138 L64 150
           C 58 138 62 126 60 116 Z"
        fill="url(#hairG)" stroke="#2F4A36" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- лицо -->
  <ellipse cx="100" cy="104" rx="36" ry="42" fill="url(#skinG)" stroke="#2F4A36" stroke-width="2.4"/>

  <!-- чёлка / передние пряди (ломкие, торчат) -->
  <path d="M66 92 C 64 64 84 50 100 50 C 116 50 136 64 134 92
           C 128 80 120 74 112 80 C 116 70 108 64 100 66 C 92 64 84 70 88 80 C 80 74 72 80 66 92 Z"
        fill="url(#hairG)" stroke="#2F4A36" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- грустные брови (домиком) -->
  <path d="M76 92 C 82 88 90 88 95 91" fill="none" stroke="#2F4A36" stroke-width="2" stroke-linecap="round"/>
  <path d="M124 92 C 118 88 110 88 105 91" fill="none" stroke="#2F4A36" stroke-width="2" stroke-linecap="round"/>

  <!-- грустные глаза (опущенные внешние уголки) -->
  <path d="M80 102 C 84 99 90 99 93 103" fill="none" stroke="#2F4A36" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M120 102 C 116 99 110 99 107 103" fill="none" stroke="#2F4A36" stroke-width="2.2" stroke-linecap="round"/>

  <!-- грустный рот -->
  <path d="M90 130 C 95 124 105 124 110 130" fill="none" stroke="#2F4A36" stroke-width="2.2" stroke-linecap="round"/>

  <!-- высыпания на щеках и лбу -->
  <g fill="#D17A66">
    <circle cx="76" cy="116" r="2.1"/>
    <circle cx="82" cy="121" r="1.7"/>
    <circle cx="79" cy="110" r="1.5"/>
    <circle cx="85" cy="114" r="1.4"/>
    <circle cx="124" cy="116" r="2.1"/>
    <circle cx="118" cy="121" r="1.7"/>
    <circle cx="121" cy="110" r="1.5"/>
    <circle cx="115" cy="114" r="1.4"/>
    <circle cx="96" cy="84" r="1.5"/>
    <circle cx="104" cy="86" r="1.4"/>
    <circle cx="100" cy="124" r="1.4"/>
  </g>
</svg>
